name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg (for probe/extract tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --bin gander   # 63 deterministic tests; live backends are #[ignore]

  musl-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No Swatinem/rust-cache here, on purpose. cross runs the build inside a
      # container, so host-built artifacts in target/ are not valid there. When the
      # cache restored, build scripts compiled against the runner's glibc were
      # executed in the container and died with `GLIBC_2.28 not found`; when it
      # missed, everything rebuilt in-container and passed. That made CI flaky on
      # cache state alone. See Cross.toml for the image side of the same problem.
      # `cross` provides the musl C cross-toolchain that rusqlite's bundled SQLite
      # and portable-pty need to link a fully static binary.
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gander-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gander
